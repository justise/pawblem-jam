<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pawblem Editor</title>
    <!-- Installable as a desktop app (Chrome/Edge: Install button in the address bar; Safari: File > Add to Dock) -->
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <meta name="theme-color" content="#1a36db" />
    <link rel="icon" type="image/png" href="/admin/icon-192.png" />
    <link rel="apple-touch-icon" href="/admin/icon-192.png" />
    <!-- Sign-in (Netlify Identity, with Google) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Login page: black top half so the logo's black background blends in,
         sign-in button on white below. Selectors match Decap 3.17.3's
         emotion class labels; recheck them when upgrading Decap. -->
    <style>
      section[class*='StyledAuthenticationPage'] {
        justify-content: flex-start;
        gap: 0;
        height: auto;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 0 0 72px; /* room for the Decap credit pinned to the bottom */
        background: linear-gradient(to bottom, #000 50vh, #fff 50vh);
      }
      [class*='StyledAuthenticationPage'] > [class*='CustomIconWrapper'] {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        height: 50vh;
        width: 100%;
        margin: 0;
        padding: 0 16px;
      }
      [class*='StyledAuthenticationPage'] > [class*='CustomIconWrapper'] img {
        max-width: min(540px, 100%);
        height: auto;
      }
      [class*='StyledAuthenticationPage'] > [class*='LoginButton'] {
        margin-top: 64px;
        padding: 0 28px;
        height: 48px;
        font-size: 16px;
        background-color: #000;
        color: #fff;
      }
      [class*='StyledAuthenticationPage'] > [class*='GoBackButtonStyle'] {
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
    <!-- Live preview of each page, using the real site styles -->
    <script src="/admin/preview.js"></script>
  </body>
</html>
